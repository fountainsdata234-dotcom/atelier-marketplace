name: Diagnose Fabsattire Android startup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-startup-diagnostic.yml'
      - 'scripts/android-startup-diagnostic.sh'

permissions:
  contents: read

jobs:
  diagnose-android-startup:
    name: Launch latest APK on Android 11 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v5

      - name: Download latest signed APK
        run: |
          curl --fail --location --retry 3 \
            https://github.com/fountainsdata234-dotcom/atelier-marketplace/releases/latest/download/app-release.apk \
            --output "$RUNNER_TEMP/app-release.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android 11 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: bash scripts/android-startup-diagnostic.sh

      - name: Upload startup diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabsattire-android-startup-diagnostic
          path: ${{ runner.temp }}/android-startup-diagnostic.txt
          if-no-files-found: warn
          retention-days: 7
