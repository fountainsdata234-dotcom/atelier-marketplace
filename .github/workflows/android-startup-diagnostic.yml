name: Diagnose Fabsattire Android startup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-startup-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose-android-startup:
    name: Launch latest APK on Android 11 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download latest signed APK
        run: |
          curl --fail --location --retry 3 \
            https://github.com/fountainsdata234-dotcom/atelier-marketplace/releases/latest/download/app-release.apk \
            --output "$RUNNER_TEMP/app-release.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch APK in Android 11 emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set +e
            adb shell pm list packages com.android.chrome > "$RUNNER_TEMP/chrome-package.txt"
            adb install -r "$RUNNER_TEMP/app-release.apk" \
              > "$RUNNER_TEMP/install-result.txt" 2>&1
            install_status=$?
            if [ "$install_status" -eq 0 ]; then
              adb shell am start -W -n com.fabsattire.app/.LauncherActivity \
                > "$RUNNER_TEMP/launch-result.txt" 2>&1
              launch_status=$?
              sleep 20
            else
              launch_status=1
              echo "Launch was skipped because APK installation failed." \
                > "$RUNNER_TEMP/launch-result.txt"
            fi

            {
              echo "APK install exit code: $install_status"
              echo "Activity launch exit code: $launch_status"
              echo
              echo "Chrome package on emulator:"
              cat "$RUNNER_TEMP/chrome-package.txt"
              echo
              echo "APK install result:"
              cat "$RUNNER_TEMP/install-result.txt"
              echo
              echo "Activity launch result:"
              cat "$RUNNER_TEMP/launch-result.txt"
              echo
              echo "Relevant Android startup errors:"
              adb logcat -d -v threadtime -s AndroidRuntime:E ActivityTaskManager:E
            } > "$RUNNER_TEMP/android-startup-diagnostic.txt" 2>&1

            cat "$RUNNER_TEMP/android-startup-diagnostic.txt"
            if [ "$install_status" -ne 0 ] || [ "$launch_status" -ne 0 ] \
              || grep -q "FATAL EXCEPTION" "$RUNNER_TEMP/android-startup-diagnostic.txt"; then
              exit 1
            fi

      - name: Upload startup diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabsattire-android-startup-diagnostic
          path: ${{ runner.temp }}/android-startup-diagnostic.txt
          if-no-files-found: warn
          retention-days: 7
